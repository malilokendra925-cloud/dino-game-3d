name: Build Android APK with NDK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        sdkmanager "ndk;25.2.9519653" "build-tools;33.0.2" "platforms;android-33"

    - name: Compile and Package APK
      run: |
        echo "Building Android APK package..."
        mkdir -p app/src/main/cpp
        cp DinoGame3D.cpp app/src/main/cpp/
        
        echo "LOCAL_PATH := \$(call my-dir)" > app/src/main/cpp/Android.mk
        echo "include \$(CLEAR_VARS)" >> app/src/main/cpp/Android.mk
        echo "LOCAL_MODULE := main" >> app/src/main/cpp/Android.mk
        echo "LOCAL_SRC_FILES := DinoGame3D.cpp" >> app/src/main/cpp/Android.mk
        echo "LOCAL_LDLIBS := -llog -landroid -lGLESv2 -lEGL" >> app/src/main/cpp/Android.mk
        echo "include \$(BUILD_SHARED_LIBRARY)" >> app/src/main/cpp/Android.mk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DinoGame-Android-APK
        path: app/build/outputs/apk/debug/*.apk        echo "LOCAL_MODULE := main" >> app/src/main/cpp/Android.mk
        echo "LOCAL_SRC_FILES := DinoGame3D.cpp" >> app/src/main/cpp/Android.mk
        echo "LOCAL_LDLIBS := -llog -landroid -lGLESv2 -lEGL" >> app/src/main/cpp/Android.mk
        echo "include \$(BUILD_SHARED_LIBRARY)" >> app/src/main/cpp/Android.mk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DinoGame-Android-APK
        path: app/build/outputs/apk/debug/*.apk
